plugins {
    id 'java-library'
    id 'maven-publish'
    // Applied at root to prevent conflict when multiple NeoForge subprojects
    // each try to register the IntelliJ IDEA extension independently.
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.2' apply false
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = findProperty('mod_group_id') ?: 'net.tysontheember.examplemod'
    version = findProperty('mod_version') ?: '1.0.0'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://cursemaven.com' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.blamejared.com' } // JEI
    }

    java {
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// Don't build root project
tasks.named('jar') {
    enabled = false
}
